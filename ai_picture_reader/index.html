<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔊 Talk & Solve Scanner</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; --danger: #ef4444; --success: #22c55e; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 8px; }
        .view-window { width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 4/3; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        .btn { background-color: var(--accent); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background-color: var(--danger); }
        .card { background-color: var(--card); padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        input { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; color: white; font-size: 16px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #334155; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab.active { background: var(--accent); }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; display: none; }
        .alert-error { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
        .alert-success { background-color: rgba(34, 197, 94, 0.2); border: 1px solid var(--success); color: #86efac; }
        audio { width: 100%; margin-top: 8px; }
        .hidden { display: none !important; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: white; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div id="alert-box" class="alert alert-error"></div>

    <!-- PANEL 1: GATEWAY ACCESS PANEL (UNAUTHENTICATED) -->
    <div id="auth-panel" class="card">
        <div class="tabs">
            <div id="tab-login" class="tab active" onclick="switchTab('login')">🔒 Sign In</div>
            <div id="tab-register" class="tab" onclick="switchTab('register')">📝 Join</div>
        </div>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" placeholder="name@example.com">
        </div>
        <div id="password-group" class="input-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>
        
        <button id="auth-action-btn" class="btn" onclick="handleAuth()">Submit</button>
        <p id="forgot-toggle" style="text-align:center; font-size:14px; color:var(--accent); cursor:pointer; margin-top:12px;" onclick="toggleForgotPassword(true)">Forgot Password?</p>
        <p id="back-to-login" class="hidden" style="text-align:center; font-size:14px; color:var(--accent); cursor:pointer; margin-top:12px;" onclick="toggleForgotPassword(false)">Back to Login</p>
    </div>

    <!-- PANEL 2: PASSWORD UPDATE FORM (ROUTED BY CALLBACK) -->
    <div id="reset-panel" class="card hidden">
        <h3>🔑 Set New Password</h3>
        <div class="input-group">
            <label>New Secure Password</label>
            <input type="password" id="new-pass-input" placeholder="Min 8 characters">
        </div>
        <button class="btn" onclick="submitNewPassword()">Update Password</button>
    </div>

    <!-- PANEL 3: MEMBERSHIP PAYWALL RESTRICTION SCREEN -->
    <div id="paywall-panel" class="card hidden" style="text-align: center;">
        <span style="font-size: 48px;">🎟️</span>
        <h2>Access Restricted</h2>
        <p style="color: #94a3b8; margin-bottom: 20px;">A premium membership plan layout is required to activate scanning engine components.</p>
        <button class="btn" onclick="redirectToCheckout()">Upgrade to Premium Now</button>
        <button class="btn btn-danger" style="margin-top: 8px;" onclick="handleLogout()">Sign Out</button>
    </div>

    <!-- PANEL 4: MAIN ACTIVE CAMERA WORKSPACE (PREMIUM SUITE) -->
    <div id="app-panel" class="hidden" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="user-display" style="font-size:14px; color:#94a3b8;">User: loading...</span>
            <span style="color:var(--accent); font-size:14px; cursor:pointer; font-weight:bold;" onclick="handleLogout()">Sign Out</span>
        </div>
        <div class="view-window">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="capture-canvas"></canvas>
        </div>
        
        <button id="snap-btn" class="btn" onclick="captureAndSolve()">📸 Snap & Solve</button>
        <div id="loading" style="text-align: center; display: none;"><div class="spinner"></div><p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Analyzing visual tracks...</p></div>

        <div id="audio-card" class="card hidden">
            <h3>🔊 Audio Explanation</h3>
            <audio id="solution-audio" controls></audio>
        </div>

        <div id="text-card" class="card hidden">
            <h3>📝 Visual Solution Breakdown</h3>
            <div id="solution-markdown" style="line-height:1.6;"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://ai-vision-scanner.onrender.com";
    let activeTab = 'login';
    let isForgotPasswordMode = false;
    let videoStream = null;

    // --- APPLICATION WORKFLOW STATE ENGINE ON LOAD ---
    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. Check if the URL string is a password update context loop callback
        if (urlParams.has('access_token') && window.location.pathname.includes('update-password')) {
            localStorage.setItem('reset_token', urlParams.get('access_token'));
            showPanel('reset-panel');
            return;
        }

        // 2. Normal validation check evaluating persistent local storage data tokens
        const storedToken = localStorage.getItem('access_token');
        const storedUser = localStorage.getItem('user_id');
        
        if (storedToken && storedUser) {
            checkUserSubscription(storedUser);
        } else {
            showPanel('auth-panel');
        }
    });

    // --- INTERFACE LAYOUT ROUTER CONTROLLER ---
    function showPanel(panelId) {
        ['auth-panel', 'reset-panel', 'paywall-panel', 'app-panel'].forEach(p => {
            document.getElementById(p).classList.add('hidden');
        });
        document.getElementById(panelId).classList.remove('hidden');
        
        if (panelId === 'app-panel') {
            initCameraHardware();
        } else {
            killCameraHardware();
        }
    }

    function showAlert(msg, isSuccess = false) {
        const box = document.getElementById('alert-box');
        box.textContent = msg;
        box.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 6000);
    }

    // --- SUBPANEL AUTH TOGGLE RULES ---
    function switchTab(tab) {
        if (isForgotPasswordMode) return;
        activeTab = tab;
        document.getElementById('tab-login').className = `tab ${tab === 'login' ? 'active' : ''}`;
        document.getElementById('tab-register').className = `tab ${tab === 'register' ? 'active' : ''}`;
    }

    function toggleForgotPassword(isForgot) {
        isForgotPasswordMode = isForgot;
        document.getElementById('password-group').style.display = isForgot ? 'none' : 'flex';
        document.getElementById('forgot-toggle').className = isForgot ? 'hidden' : '';
        document.getElementById('back-to-login').className = isForgot ? '' : 'hidden';
        document.getElementById('auth-action-btn').textContent = isForgot ? 'Send Recovery Link' : 'Submit';
        document.querySelectorAll('.tab').forEach(t => t.style.opacity = isForgot ? '0.3' : '1');
    }

    // --- CLIENT API NETWORK HANDLERS ---
    async function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;

        if (!email) return showAlert("Email value is required.");

        // ==========================================
        // HERE IS EVERYTHING AFTER THAT INTERCEPT LINE
        // ==========================================
        if (isForgotPasswordMode) {
            const res = await fetch(`${API_BASE}/auth/forgot-password?email=${encodeURIComponent(email)}`, { method: 'POST' });
            if (res.ok) {
                showAlert("Recovery email dispatched cleanly!", true);
                toggleForgotPassword(false);
                switchTab('login');
            } else {
                showAlert("Failed to process reset query request.");
            }
            return;
        }

        const endpoint = activeTab === 'login' ? '/auth/login' : '/auth/register';
        try {
            const res = await fetch(`${API_BASE}${endpoint}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, { method: 'POST' });
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.detail || "Authentication entry validation error.");

            if (activeTab === 'register') {
                showAlert("Account built successfully! Confirm email links before logging in.", true);
                switchTab('login');
            } else {
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('user_email', email);
                checkUserSubscription(data.user_id);
            }
        } catch(err) {
            showAlert(err.message);
        }
    }

    async function checkUserSubscription(uid) {
        try {
            const res = await fetch(`${API_BASE}/billing/checkout?user_id=${uid}`);
            if (res.status === 403) {
                showPanel('paywall-panel');
            } else if (res.ok) {
                document.getElementById('user-display').textContent = `Logged in: ${localStorage.getItem('user_email') || 'Account'}`;
                showPanel('app-panel');
            } else {
                showPanel('paywall-panel');
            }
        } catch {
            showPanel('paywall-panel');
        }
    }

    function redirectToCheckout() {
        const uid = localStorage.getItem('user_id');
        window.location.href = `${API_BASE}/billing/checkout?user_id=${uid}`;
    }

    async function submitNewPassword() {
        const token = localStorage.getItem('reset_token');
        const pass = document.getElementById('new-pass-input').value;
        if (!pass) return showAlert("Field cannot be blank.");

        try {
            const res = await fetch(`${API_BASE}/auth/update-password?access_token=${token}&new_password=${encodeURIComponent(pass)}`, { method: 'POST' });
            if (!res.ok) throw new Error("Token reference processing expired.");
            
            showAlert("Password modified successfully!", true);
            localStorage.clear();
            setTimeout(() => { window.location.href = window.location.pathname; }, 2000);
        } catch(err) {
            showAlert(err.message);
        }
    }

    // --- CORE PREMIUM HARDWARE & ML SCANNER CONTROL ---
    async function initCameraHardware() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            document.getElementById('webcam').srcObject = videoStream;
        } catch {
            showAlert("Camera hardware access fault parameters.");
        }
    }

    function killCameraHardware() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
    }

    async function captureAndSolve() {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('capture-canvas');
        const snapBtn = document.getElementById('snap-btn');
        const loading = document.getElementById('loading');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        snapBtn.style.display = 'none';
        loading.style.display = 'block';

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'frame.jpg');

            try {
                const uid = localStorage.getItem('user_id');
                const res = await fetch(`${API_BASE}/scanner/solve?user_id=${uid}`, { method: 'POST', body: formData });
                if (!res.ok) throw new Error("Processing failed.");
                
                const data = await res.json();
                
                document.getElementById('solution-markdown').innerHTML = data.solution_text.replace(/\n/g, '<br>');
                document.getElementById('text-card').classList.remove('hidden');

                if (data.cache_id) {
                    document.getElementById('solution-audio').src = `${API_BASE}/scanner/audio/${data.cache_id}`;
                    document.getElementById('audio-card').classList.remove('hidden');
                }
            } catch(err) {
                showAlert(err.message);
            } finally {
                snapBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        }, 'image/jpeg', 0.9);
    }

    function handleLogout() {
        localStorage.clear();
        killCameraHardware();
        window.location.href = window.location.pathname;
    }
</script>
